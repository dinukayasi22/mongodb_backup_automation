name: Manual Multi-Cluster MongoDB Backup to R2

on:
  workflow_dispatch: # Trigger the backup manually via the GitHub UI

jobs:
  backup-all:
    runs-on: ubuntu-latest
    steps:
      - name: Download mongodump
        run: |
          curl -O https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar -zxvf mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          sudo cp mongodb-database-tools-ubuntu2204-x86_64-100.9.4/bin/mongodump /usr/local/bin/

      - name: Backup and Upload Each Cluster
        env:
          CLUSTERS_CONFIG: ${{ secrets.CLUSTERS_CONFIG }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d-%H%M')

          # Iterate over each cluster entry in the JSON array
          echo "$CLUSTERS_CONFIG" | jq -c '.[]' | while read -r cluster; do
            NAME=$(echo "$cluster" | jq -r '.name')
            URI=$(echo "$cluster" | jq -r '.uri')
            FILE_NAME="${NAME}-backup-${TIMESTAMP}.gz"

            echo "=========================================="
            echo "Starting backup for: ${NAME}"
            echo "=========================================="

            # Create the archive
            mongodump --uri="$URI" --archive="$FILE_NAME" --gzip

            # Upload to Cloudflare R2 into a cluster-specific folder
            aws s3 cp "$FILE_NAME" "s3://${S3_BUCKET}/${NAME}/${FILE_NAME}" \
              --endpoint-url "$S3_ENDPOINT" \
              --region auto

            # Remove the local archive to save disk space on the runner
            rm -f "$FILE_NAME"
            echo "Completed and uploaded ${NAME} backup successfully."
          done